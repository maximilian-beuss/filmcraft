name: Fork release

# Builds unsigned desktop artifacts for Linux, Windows and macOS on the fork and publishes
# them as a GitHub release. The upstream Release workflow needs signing secrets that a fork
# does not have, so this workflow builds the same packaging scripts without signing.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (empty: v<Cargo version>-fork)"
        type: string
        default: ""
      prerelease:
        description: "Mark the release as a pre-release"
        type: boolean
        default: false

permissions:
  contents: write

env:
  CARGO_PROFILE_RELEASE_DEBUG: "0"
  CRAFT_FONTS_REPO: https://github.com/storytold/craft-fonts
  CRAFT_FONTS_REF: b076417b5880bd4154bd22f00695b1d28c6bea83

concurrency:
  group: fork-release
  cancel-in-progress: false

jobs:
  linux:
    name: linux-x86_64
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev \
            libxcursor-dev libxrandr-dev libxi-dev libfontconfig1-dev libfreetype-dev \
            mesa-vulkan-drivers libasound2-dev libvulkan1 build-essential

      - name: Fetch craft fonts
        run: |
          git init "$RUNNER_TEMP/craft-fonts"
          git -C "$RUNNER_TEMP/craft-fonts" remote add origin "$CRAFT_FONTS_REPO"
          git -C "$RUNNER_TEMP/craft-fonts" fetch --depth 1 origin "$CRAFT_FONTS_REF"
          git -C "$RUNNER_TEMP/craft-fonts" checkout FETCH_HEAD
          echo "CRAFT_FONTS_DIR=$RUNNER_TEMP/craft-fonts" >> "$GITHUB_ENV"

      - name: Package (tar.gz)
        id: pkg
        continue-on-error: true
        env:
          CRAFT_FONTS_REQUIRED: "1"
        run: packaging/linux/package.sh --formats "tar"

      - name: Fallback plain archive
        if: steps.pkg.outcome == 'failure'
        run: |
          cargo build --release --locked -p filmcraft -p filmcraft-cli --features filmcraft/neural-voices
          v=$(awk '/^\[workspace.package\]/{p=1;next} p&&$1=="version"{gsub(/[" ]/,"",$3);print $3;exit}' Cargo.toml)
          mkdir -p dist/release
          tar -C target/release -czf "dist/release/filmcraft-$v-linux-x86_64.tar.gz" filmcraft filmcraft-cli README.md 2>/dev/null || \
          tar -C target/release -czf "dist/release/filmcraft-$v-linux-x86_64.tar.gz" filmcraft filmcraft-cli

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/release/*
          if-no-files-found: error

  windows:
    name: windows-x86_64
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Fetch craft fonts
        shell: pwsh
        run: |
          git init "$env:RUNNER_TEMP/craft-fonts"
          git -C "$env:RUNNER_TEMP/craft-fonts" remote add origin $env:CRAFT_FONTS_REPO
          git -C "$env:RUNNER_TEMP/craft-fonts" fetch --depth 1 origin $env:CRAFT_FONTS_REF
          git -C "$env:RUNNER_TEMP/craft-fonts" checkout FETCH_HEAD
          "CRAFT_FONTS_DIR=$env:RUNNER_TEMP/craft-fonts" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install WiX
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Package (MSI + portable zip)
        id: pkg
        continue-on-error: true
        shell: pwsh
        env:
          CRAFT_FONTS_REQUIRED: "1"
          FILMCRAFT_REQUIRE_WINRES: "1"
        run: pwsh -NoProfile -File packaging/windows/package.ps1 -Arch x64

      - name: Fallback portable zip
        if: steps.pkg.outcome == 'failure'
        shell: pwsh
        run: |
          cargo build --release --locked -p filmcraft -p filmcraft-cli --features filmcraft/neural-voices
          $v = (Select-String -Path Cargo.toml -Pattern '^\s*version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches.Groups[1].Value
          New-Item -ItemType Directory -Force -Path dist/release | Out-Null
          Compress-Archive -Path target/release/filmcraft.exe, target/release/filmcraft-cli.exe, README.md -DestinationPath "dist/release/filmcraft-$v-windows-x86_64-portable.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/release/*
          if-no-files-found: error

  macos:
    name: macos-universal
    runs-on: macos-15
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Add Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Fetch craft fonts
        run: |
          git init "$RUNNER_TEMP/craft-fonts"
          git -C "$RUNNER_TEMP/craft-fonts" remote add origin "$CRAFT_FONTS_REPO"
          git -C "$RUNNER_TEMP/craft-fonts" fetch --depth 1 origin "$CRAFT_FONTS_REF"
          git -C "$RUNNER_TEMP/craft-fonts" checkout FETCH_HEAD
          echo "CRAFT_FONTS_DIR=$RUNNER_TEMP/craft-fonts" >> "$GITHUB_ENV"

      - name: Package (ad-hoc signed DMG + CLI zip)
        id: pkg
        continue-on-error: true
        env:
          CRAFT_FONTS_REQUIRED: "1"
          MACOS_SIGN_IDENTITY: "-"
        run: packaging/macos/package.sh --arch universal

      - name: Fallback plain archive
        if: steps.pkg.outcome == 'failure'
        run: |
          cargo build --release --locked -p filmcraft -p filmcraft-cli --features filmcraft/neural-voices
          v=$(awk '/^\[workspace.package\]/{p=1;next} p&&$1=="version"{gsub(/[" ]/,"",$3);print $3;exit}' Cargo.toml)
          mkdir -p dist/release
          tar -C target/release -czf "dist/release/filmcraft-$v-macos-universal.tar.gz" filmcraft filmcraft-cli README.md 2>/dev/null || \
          tar -C target/release -czf "dist/release/filmcraft-$v-macos-universal.tar.gz" filmcraft filmcraft-cli

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/release/*
          if-no-files-found: error

  release:
    name: publish release
    needs: [linux, windows, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/release
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          INPUT_TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          version=$(awk '/^\[workspace.package\]/{p=1;next} p&&$1=="version"{gsub(/[" ]/,"",$3);print $3;exit}' Cargo.toml)
          tag="${INPUT_TAG:-v$version-fork}"
          ls -l dist/release
          notes="Unsigned fork build of FilmCraft $version from ${GITHUB_SHA}.
          Built by the fork's own workflow; macOS bundles are ad-hoc signed, Windows and Linux are unsigned."
          args=(--title "FilmCraft $version (fork build)" --notes "$notes")
          [ "$PRERELEASE" = "true" ] && args+=(--prerelease)
          gh release create "$tag" dist/release/* "${args[@]}"
